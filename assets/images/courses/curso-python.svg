<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Ventana de código con un programa en Python">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A2647"/><stop offset="1" stop-color="#0d3b6e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#00B4D8" stop-opacity="0.35"/><stop offset="1" stop-color="#00B4D8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#00B4D8" fill-opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <rect width="800" height="800" fill="url(#dots)"/>
  <rect width="800" height="800" fill="url(#glow)"/>
  <!-- red de nodos -->
  <g stroke="#00B4D8" stroke-opacity="0.35" stroke-width="2" fill="#00B4D8">
    <line x1="610" y1="90" x2="720" y2="160"/><line x1="720" y1="160" x2="690" y2="270"/><line x1="610" y1="90" x2="560" y2="190"/><line x1="560" y1="190" x2="690" y2="270"/>
    <circle cx="610" cy="90" r="7"/><circle cx="720" cy="160" r="9"/><circle cx="690" cy="270" r="6"/><circle cx="560" cy="190" r="5"/>
  </g>
  <!-- ventana -->
  <g transform="translate(70 245)">
    <rect width="660" height="410" rx="18" fill="#071a33" stroke="#00B4D8" stroke-opacity="0.6" stroke-width="2"/>
    <rect width="660" height="52" rx="18" fill="#0f2f55"/><rect y="34" width="660" height="18" fill="#0f2f55"/>
    <circle cx="32" cy="26" r="8" fill="#ff6b6b"/><circle cx="58" cy="26" r="8" fill="#ffd166"/><circle cx="84" cy="26" r="8" fill="#06d6a0"/>
    <text x="330" y="33" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="20" fill="#9fb3c8">clase_01.py</text>
    <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="24">
      <text x="30" y="105" fill="#6c8aa8"># Promedio de temperaturas</text>
      <text x="30" y="150"><tspan fill="#e6edf3">temps = [</tspan><tspan fill="#ffd166">18</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#ffd166">21</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#ffd166">24</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#ffd166">22</tspan><tspan fill="#e6edf3">]</tspan></text>
      <text x="30" y="195"><tspan fill="#e6edf3">prom = </tspan><tspan fill="#00B4D8">sum</tspan><tspan fill="#e6edf3">(temps) / </tspan><tspan fill="#00B4D8">len</tspan><tspan fill="#e6edf3">(temps)</tspan></text>
      <text x="30" y="240"><tspan fill="#00B4D8">print</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#06d6a0">f"Promedio: {prom} °C"</tspan><tspan fill="#e6edf3">)</tspan></text>
      <line x1="30" y1="285" x2="630" y2="285" stroke="#1f4570" stroke-width="2"/>
      <text x="30" y="330" fill="#9fb3c8">&gt;&gt;&gt; <tspan fill="#06d6a0">Promedio: 21.25 °C</tspan></text>
      <rect x="30" y="360" width="14" height="28" fill="#00B4D8"><animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></rect>
    </g>
  </g>
  <text x="70" y="165" font-family="Montserrat, 'Open Sans', Arial, sans-serif" font-weight="700" font-size="56" fill="#ffffff">Programación</text>
  <text x="70" y="220" font-family="Montserrat, 'Open Sans', Arial, sans-serif" font-weight="700" font-size="56" fill="#00B4D8">con Python</text>
</svg>
